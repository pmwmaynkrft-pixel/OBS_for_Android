name: Android APK (arm64-v8a)

on:
  push:
    branches:
      - perf/realme8-smoothness
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ANDROID_PLATFORM: android-35
      ANDROID_NDK_VERSION: 30.0.16138531
      QT_VERSION: 6.9.3
      GRADLE_VERSION: 8.14.5
      OBS_PROXY: ""
      JOBS: "2"
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive

      - name: Install host build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential libtool nasm pkg-config python3-venv unzip zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and exact NDK/platform/build-tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          mkdir -p "$HOME/ndk"
          ln -sfn "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" "$HOME/ndk/${ANDROID_NDK_VERSION}"

      - name: Install pinned Python build tools
        run: |
          python3 -m venv "$HOME/.venv"
          "$HOME/.venv/bin/pip" install --disable-pip-version-check cmake==3.31.6 ninja==1.13.2 aqtinstall==3.2.1
          echo "$HOME/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Qt 6.9.3 Android and Linux host kits
        run: |
          aqt install-qt linux desktop "$QT_VERSION" gcc_64 -O "$HOME/Qt" -m qtsvg
          aqt install-qt linux android "$QT_VERSION" android_arm64_v8a -O "$HOME/Qt" -m qtsvg
          echo "QT_DIR=$HOME/Qt/$QT_VERSION" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$HOME/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      - name: Install Gradle 8.14.5 and verify distribution checksum
        run: |
          mkdir -p "$HOME/toolchain"
          curl -fL --retry 3 "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o "$RUNNER_TEMP/gradle.zip"
          curl -fL --retry 3 "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip.sha256" -o "$RUNNER_TEMP/gradle.sha256"
          printf '%s  %s\n' "$(tr -d '\r\n' < "$RUNNER_TEMP/gradle.sha256")" "$RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$HOME/toolchain"

      - name: Prepare repository path expected by build scripts
        run: ln -s "$GITHUB_WORKSPACE" "$HOME/OBS_for_Android"

      - name: Record build environment
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          {
            date -u
            uname -a
            java -version
            cmake --version
            ninja --version
            "$HOME/toolchain/gradle-${GRADLE_VERSION}/bin/gradle" --version
            cat "$ANDROID_SDK_ROOT/source.properties" 2>/dev/null || true
            cat "$NDK_ROOT/source.properties"
            "$QT_HOST_PATH/bin/qmake" -query QT_VERSION 2>/dev/null || true
          } 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/build-environment.log"

      - name: Validate scripts and fetch pinned dependency sources
        run: |
          set -o pipefail
          for script in deps-android/fetch.sh deps-android/build.sh deps-android/defs.sh scripts/build-frontend-apk-wsl.sh; do
            bash -n "$script"
          done
          ./deps-android/fetch.sh 2>&1 | tee ci-logs/dependency-fetch.log

      - name: Build Android third-party dependencies
        run: |
          set -o pipefail
          export NDK="$HOME/ndk/${ANDROID_NDK_VERSION}" API=29 JOBS=2
          ./deps-android/build.sh arm64-v8a 2>&1 | tee ci-logs/dependency-build.log

      - name: Build and package arm64-v8a APK
        run: |
          set -o pipefail
          bash scripts/build-frontend-apk-wsl.sh 2>&1 | tee ci-logs/apk-build.log

      - name: Collect APK and final hashes
        if: success()
        run: |
          mkdir -p ci-artifacts
          cp releases/OBS-Android-arm64-v8a-wsl-*.apk ci-artifacts/
          sha256sum ci-artifacts/*.apk | tee ci-logs/apk.sha256
          md5sum ci-artifacts/*.apk | tee ci-logs/apk.md5

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs-android-build-logs-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: obs-android-arm64-v8a-apk-${{ github.run_id }}
          path: ci-artifacts/*.apk
          if-no-files-found: error
          retention-days: 7
